[tool-installer]
manifest = "./manifest.toml"

# ── Layer 0: 系统基础包与构建工具链（必须最先安装）──
[system-packages]
"system-packages@1" = "系统基础包与构建工具链（apt/brew）"

# ── Layer 0: 字体（体验增强，非必须）──
[fonts]
depends = ["system-packages"]
"fonts@1" = "系统字体 + IBM Plex + FiraCode Nerd Font（apt/brew + GitHub）"

# ── Layer 1a: 编译基础设施 ──
[build-base]
depends = ["system-packages"]
rustup-install = "安装 rustup（vendor 脚本）"
"rust@stable" = "Rust stable toolchain"

# ── Layer 1b: Cargo 预编译安装器（独立，不需要 Rust）──
# 必须在 cargo-tools 之前安装，因为 cargo-tools 中的工具使用 binstall_first
[cargo-binstall]
"cargo-binstall@v1.19.1" = { desc = "Cargo 预编译安装器", allow_fail = true }

# ── Layer 1c: Cargo 工具（依赖 Rust + cargo-binstall）──
[cargo-tools]
depends = ["build-base", "cargo-binstall"]
# sccache 被已部署的 ~/.cargo/config.toml 以 rustc-wrapper 引用，装不上会让全机每次
# cargo 调用失败，所以它不能 allow_fail——那条错误在构建时才出现，离原因太远。
"sccache@0.15.0" = "编译缓存"
"wild-linker@0.9.0" = { desc = "快速链接器", allow_fail = true }
"mise@2026.4.5" = "版本管理器"
"uv@0.11.18" = "Python 包管理器"
"cargo-audit@0.22.1" = "依赖审计"
"bat@0.26.1" = "Cat 替代品"
"eza@0.23.4" = "ls 替代品"
"fd-find@10.4.2" = "find 替代品"
"zoxide@0.9.9" = "cd 替代品"
"tokei@14.0.0" = "代码统计"
"navi@2.24.0" = "交互式命令行"
"gitui@0.28.1" = { desc = "Git TUI", allow_fail = true }
"kondo@0.9.0" = "项目清理"
"jaq@3.0.0" = "jq 替代品"
"mdbook@0.5.2" = "文档生成器"
"mdbook-mermaid@0.17.0" = "mdbook 图表"
"gen-mdbook-summary@0.0.10" = "mdbook 目录"
"tree-sitter-cli@0.26.8" = { desc = "语法解析器", allow_fail = true }
"tree-sitter-grep@0.1.0" = { desc = "语法感知搜索", allow_fail = true }
"tree-sitter-show-ast@0.0.2" = { desc = "AST 可视化", allow_fail = true }
"macchina@6.4.0" = "系统信息"
"conceal@0.7.0" = "隐藏敏感信息"
"rust-script@0.36.0" = "Rust 脚本运行器"
"parallel-disk-usage@0.22.0" = "磁盘分析"
"nu@0.112.2" = "现代 Shell"
"cargo-fuzz@0.13.2" = { desc = "模糊测试", allow_fail = true }
"grcov@0.10.7" = { desc = "代码覆盖率", allow_fail = true }
"cargo-tarpaulin@0.35.4" = { desc = "代码覆盖率", allow_fail = true }

# ── Layer 1f: 静态网站工具（独立，github-release 预编译）──
[zola]
"zola@v0.22.1" = "静态网站生成器"

# ── Layer 1f: 文档排版工具（独立，github-release 预编译）──
[typst]
"typst@v0.15.1" = "Typst 排版编译器（简历 → PDF 渲染）"

# ── Layer 1c: Shell 工具（独立，不需要 Rust）──
[shell-tools]
"starship@v1.25.1" = "Shell prompt"
"just@1.53.0" = "命令运行器"

# ── Layer 1c: 用户工具（精确锁定，跨平台一致）──
[user-tools]
"gh@v2.97.0" = "GitHub CLI"
"ripgrep@15.2.0" = "快速 grep"

# ── Layer 1d: 编辑器和终端工具（独立，不需要 Rust）──
[editors]
"neovim@v0.12.2" = "Neovim 编辑器"
"helix@25.07.1" = "Helix 编辑器"
"zellij@v0.44.3" = "终端复用器"
"yq@v4.53.3" = "YAML/JSON 处理器"

# ── Layer 1d: 语言运行时（由 mise 管理，通过 script job 安装）──
[languages]
depends = ["cargo-tools"]
"mise-install@1" = "Trust mise config and install all language runtimes"

# ── Layer 1e: LSP 服务器 ──
# 注意：lsp-servers 依赖 languages 组中的 node/pnpm
[lsp-servers]
depends = ["languages"]
"typescript-lsp@5.3.0" = { desc = "TypeScript LSP", allow_fail = true }
"pyright@1.1.410" = { desc = "Python LSP", allow_fail = true }
"yaml-lsp@1.23.0" = { desc = "YAML LSP", allow_fail = true }
"bash-lsp@5.6.0" = { desc = "Bash LSP", allow_fail = true }
"marksman@2026-02-08" = "Markdown LSP"
"zls@0.15.1" = "Zig LSP"
"lua-lsp@3.17.1" = "Lua LSP"

# ── Layer 1e-ai: AI CLI 工具（npm 全局，node 大版本切换后需重装）──
[ai-clis]
depends = ["languages"]
"claude-code@2.1.277" = { desc = "Claude Code", allow_fail = true }
"codex@0.155.1" = { desc = "OpenAI Codex CLI", allow_fail = true }
"dsh@0.1.5-rc.2" = { desc = "DeepSeek 终端助手", allow_fail = true }
"pi-coding-agent@0.85.1" = { desc = "Pi Coding Agent", allow_fail = true }
"qoder-cli@1.1.59" = { desc = "Qoder CLI", allow_fail = true }
"qwen-code@0.24.0" = { desc = "Qwen Code", allow_fail = true }

# ── Layer 1f: 其他（独立）──
[extras]
"xdotter@v0.5.2" = "配置部署工具"
"wezterm@20240203" = { desc = "终端模拟器（体验增强）", allow_fail = true }

# ── Opt-in: 按需安装（故意不列入下面的 [dev]，CI 也不覆盖）──
# 用法：tool-installer install network-tools
# rathole 走 git+rev（见 manifest.toml），git 策略要求选择器为 latest，故不写 @版本
[network-tools]
rathole = "内网穿透 / 隧道反向代理"

# 用法：tool-installer install devbox-tools
# rootless-docker 仅 Linux 有意义（macOS 上脚本只给 colima 手动指引、不代装），且不写任何 shell 配置
[devbox-tools]
"rootless-docker@1" = "免 sudo 的 rootless Docker 守护进程"

# ── 全量安装 ──
[dev]
depends = ["system-packages", "fonts", "build-base", "cargo-binstall", "cargo-tools", "user-tools", "shell-tools", "editors", "lsp-servers", "ai-clis", "languages", "extras", "zola", "typst"]
