# ============================================================
# Cargo 配置
# ============================================================
# 默认使用 rsproxy.cn 国内镜像加速
# CI 环境（GitHub Actions / 海外部署）：工作流的 "Disable mirrors for CI"
# 步骤会注释掉下方 replace-with 行，直连 crates.io
# ============================================================

[source]

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries]

[registries.crates-io]
protocol = "sparse"

[registries.bfsu]
index = "https://mirrors.bfsu.edu.cn/git/crates.io-index.git"

[registries.bfsu-sparse]
index = "sparse+https://mirrors.bfsu.edu.cn/crates.io-index/"

[registries.hit]
index = "https://mirrors.hit.edu.cn/crates.io-index.git"

[registries.nju]
index = "https://mirror.nju.edu.cn/git/crates.io-index.git"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[registries.rsproxy-sparse]
index = "sparse+https://rsproxy.cn/index/"

[registries.sjtu]
index = "https://mirrors.sjtug.sjtu.edu.cn/git/crates.io-index"

[registries.sjtu-sparse]
index = "sparse+https://mirrors.sjtug.sjtu.edu.cn/crates.io-index/"

[registries.tuna]
index = "https://mirrors.tuna.tsinghua.edu.cn/git/crates.io-index.git"

[registries.tuna-sparse]
index = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[registries.ustc]
index = "git://mirrors.ustc.edu.cn/crates.io-index"

[registries.ustc-sparse]
index = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[net]
git-fetch-with-cli = true

# 这里不设链接器覆盖。rustc 1.98 起对本 triple 已默认用内嵌 LLD，而且这个默认落在 cargo
# 配置分层之外：项目没配就用它，项目配了就完整让路。用户级 rustflags 做不到后者——
# cargo 跨层只追加不做减法，任何用户级强制都会污染项目选择（历史上 --ld-path=wild
# 就是这样把 linker = "gcc" 的项目编挂的）。链接确实是瓶颈的项目，在自己仓库里点名。

# ========== 编译加速 ==========

[build]
rustc-wrapper = "sccache"

# ========== Profile 优化 ==========

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.bench]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.full-debug]
inherits = "dev"
debug = "full"

[profile.product]
inherits = "release"
lto = "fat"
codegen-units = 1

# ========== 环境变量 ==========

[env]
RUST_BACKTRACE = "1"
RUST_LIB_BACKTRACE = "1"

[cache]
auto-clean-frequency = "1 weeks" # 每周清理一次
