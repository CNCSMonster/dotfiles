# Manifest for dotfiles development environment
# History: migrated off the legacy shell installers (see docs/tool-installer-migration-plan.md)
# Tool count: 45+ tools across 6 manager types

# ============================================================
# GitHub release manager configuration
# ============================================================

[_github-release]
github_mirrors = ["https://ghfast.top", "https://mirror.ghproxy.com"]
timeout = 120
retry = 3

# ============================================================
# Experience / optional tools
# ============================================================

[wezterm]
[wezterm.linux]
manager = "script"
path = "scripts/install-wezterm.sh"
[wezterm.macos]
manager = "script"
path = "scripts/install-wezterm.sh"

# ============================================================
# System packages (managed by tool-installer)
# ============================================================

[system-packages]
[system-packages.linux]
manager = "apt"
# 系统基础包与构建工具链：逐字迁移自 scripts/install-system-packages.sh 的
# Linux 清单（迁移前是 `command -v || dpkg -s || missing` + 批量 apt install）。
# 26 个包一个事务装完；@latest 语义 = 装了即满足，不主动升级到 candidate
# （升级是系统管理决策，由用户显式 apt upgrade；见 AptManager.check docstring）。
pkg = """
    python3 curl wget gnupg software-properties-common
    build-essential gcc g++ clang cmake ninja-build pkg-config
    libssl-dev libbz2-dev libreadline-dev libsqlite3-dev liblzma-dev
    libclang-dev libicu-dev unzip iproute2 fzf zsh tree git htop
    bubblewrap libarchive-tools p7zip-full graphviz
    """
[system-packages.macos]
manager = "script"
path = "scripts/install-system-packages.sh"

# ============================================================
# Fonts
# ============================================================

[fonts]
[fonts.linux]
manager = "script"
path = "scripts/install-fonts.sh"
[fonts.macos]
manager = "script"
path = "scripts/install-fonts.sh"

# ============================================================
# Languages & Toolchains
# ============================================================

# 安装 rustup 本身（vendor 脚本，已审查）
[rustup-install]
[rustup-install.linux]
manager = "script"
path = "scripts/install-rustup.sh"
[rustup-install.macos]
manager = "script"
path = "scripts/install-rustup.sh"

# 通过 mise 安装语言运行时（在 cargo-tools 之后执行）
[mise-install]
[mise-install.linux]
manager = "script"
path = "scripts/mise-install.sh"
[mise-install.macos]
manager = "script"
path = "scripts/mise-install.sh"


# 配置 Rust 工具链（rustup manager）
[rust]
[rust.linux]
manager = "rustup"
components = ["clippy", "rustfmt", "rust-analyzer"]
profile = "minimal"
set_default = true
[rust.macos]
manager = "rustup"
components = ["clippy", "rustfmt", "rust-analyzer"]
profile = "minimal"
set_default = true


