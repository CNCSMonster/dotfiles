# rathole: 内网穿透 / 隧道反向代理（rathole-org/rathole）
# 不用 crates.io 的 0.5.0：其 Cargo.lock 钉住 time<=0.3.29，在 rustc 1.80+ 上
# 编译失败（E0282），rustc 1.98.1 实测同样挂；且 v0.5.0 预编译包缺
# aarch64-apple-darwin（macOS x86_64 包在 Apple Silicon 上依赖 Rosetta）。
# git 策略要求 tools.toml 选择器为 latest，可复现性由下面的 rev 承担。
[rathole]
[rathole.linux]
manager = "cargo-install"
pkg = "rathole"
git = "https://github.com/rathole-org/rathole"
rev = "a292f7ed5402f840415fc6a53827da2f34337856"
locked = true

[rathole.macos]
manager = "cargo-install"
pkg = "rathole"
git = "https://github.com/rathole-org/rathole"
rev = "a292f7ed5402f840415fc6a53827da2f34337856"
locked = true

# rootless-docker: 免 sudo 用裸 docker / docker compose（见 scripts/ 内注释）。
# 两个 OS 都指向同一脚本——macOS 上 Linux 专属步骤会致命失败，脚本自己 uname 守卫、
# 打完 colima 手动指引后 exit 0（CI 跑器无硬件虚拟化，不代跑）；缺少
# os 条目会让 resolver 直接抛 StrategyError（tool-installer strategy.py:66）。
[rootless-docker]
[rootless-docker.linux]
manager = "script"
path = "scripts/setup-rootless-docker.sh"
[rootless-docker.macos]
manager = "script"
path = "scripts/setup-rootless-docker.sh"

