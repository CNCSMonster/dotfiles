name: Probe macOS colima (throwaway)

# 一次性取证作业：回答「GitHub 的 macOS 跑器能不能真跑起 colima」以及
# 「colima start 的真实参数与 docker context 行为」。拿到答案后整个文件删掉。
# 只在手动触发时运行，不参与 push/PR。

on:
  workflow_dispatch:

jobs:
  probe:
    name: "macOS runner: colima feasibility"
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Host facts
        run: |
          echo "== sw_vers =="; sw_vers
          echo "== uname =="; uname -srm
          echo "== hypervisor support =="; sysctl kern.hv_support || echo "kern.hv_support unreadable"
          echo "== virtualization framework =="; ls -d /System/Library/PrivateFrameworks/Virtualization.framework 2>/dev/null || echo "VZ framework: not at PrivateFrameworks path"
          echo "== cpu/mem =="; sysctl -n hw.ncpu hw.memsize
          echo "== brew =="; brew --version | head -1; brew --prefix

      - name: Formula availability
        run: |
          for f in colima docker docker-compose lima qemu; do
            printf "%-16s " "$f"
            brew info --json=v2 "$f" 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); fs=d.get('formulae') or []; cs=d.get('casks') or []; print('stable=' + str((fs[0].get('versions') or {}).get('stable') if fs else (cs[0].get('version') if cs else '?')))" 2>/dev/null \
              || echo "NOT FOUND via brew"
          done

      - name: Install colima + docker CLI
        run: |
          brew install colima docker docker-compose
          echo "== versions =="
          colima version | head -3
          docker --version
          docker compose version 2>&1 | head -2 || echo "docker compose subcommand unavailable"
          docker-compose --version

      - name: colima start documented flags (verbatim)
        run: colima start --help 2>&1

      - name: context list before start
        run: docker context ls 2>&1

      - name: Start colima (vz on apple silicon)
        timeout-minutes: 15
        run: |
          set -x
          colima start --vm-type vz --cpu 2 --memory 4 --disk 40 2>&1 | tail -40
          echo "start-exit=${PIPESTATUS[0]}"
          echo "== colima list =="; colima list 2>&1
          echo "== colima status =="; colima status 2>&1; echo "status-exit=$?"

      - name: docker CLI reaches the daemon
        run: |
          echo "== context after start =="; docker context ls 2>&1
          docker context use colima 2>&1 || echo "no colima context to select"
          docker version 2>&1 | tail -20

      - name: Run a container end to end
        run: |
          docker info --format 'server={{.ServerVersion}} rootless={{.SecurityOptions}} arch={{.Architecture}}' 2>&1
          docker run --rm hello-world 2>&1 | tail -10

      - name: Compose works
        run: |
          echo 'services:
            probe:
              image: alpine:3.20
              command: ["sh", "-c", "echo compose-ok; id -u"]' > /tmp/compose-probe.yaml
          docker compose -f /tmp/compose-probe.yaml up 2>&1 | tail -10

      - name: On-failure diagnostics
        if: failure()
        run: |
          echo "== colima list =="; colima list 2>&1 || true
          echo "== colima log (tail) =="; colima log 2>&1 | tail -60 || true
          ls -la ~/.colima 2>&1 || true
          echo "== lima =="; limactl list 2>&1 || true
