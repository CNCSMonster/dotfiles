name: tool-installer Migration Verify

on:
  # 纯文档改动不必跑 30 分钟安装链（历史上 `docs: replace the nonexistent
  # 'xd validate'` 一个提交跑了 14m + 11m 两套完整安装验证）。
  # 注意：GitHub Actions 的 workflow 解析器不支持 YAML anchor，两处列表必须逐字写。
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # allow_fail 工具失败不再静默：安装结束时汇总并非零退出
  TOOL_INSTALLER_STRICT: 1

jobs:
  # ── Dry-run（快速，无网络）──
  # 双 OS：full-install/re-install 只在 macOS 上跑默认安装链（dev），opt-in 模块的
  # .macos 条目否则永远不会被任何作业解析过。
  dry-run:
    name: "Dry-run (all modules) — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 模块名单从 tools.toml 枚举，不在此处维护第二份列表（否则新增 opt-in
      # 组会静默不被校验）。排除的 [tool-installer] 是配置表而非模块；
      # [dev] 是 depends 聚合组，随之覆盖全部默认安装链。
      # 用 while-read 而不是 mapfile：macOS 跑器的 /bin/bash 是 3.2，没有 mapfile。
      #
      # --skip-errors：dry-run 只做解析，个别条目的策略错误不该让整轮枚举中断，
      # 否则第 N 个模块写坏了，第 N+1 个之后的模块就再也得不到解析覆盖。
      # 严格模式由 unit-tests / vendor-sync / 实际 apply-* 安装作业把关。
      - name: Dry-run each module
        shell: bash
        run: |
          python3 -c "
          import tomllib
          with open('tools.toml', 'rb') as f:
              tables = tomllib.load(f)
          print('\n'.join(name for name in tables if name != 'tool-installer'))" > /tmp/modules.txt
          count=0
          while IFS= read -r module; do
            echo "--- $module ---"
            python3 vendor/tool-installer install "$module" --dry-run --skip-errors \
              || echo "⚠️  $module 解析失败（继续枚举后续模块）"
            count=$((count + 1))
          done < /tmp/modules.txt
          echo "覆盖 $count 个模块：$(tr '\n' ' ' < /tmp/modules.txt)"

  # ── 单元测试（源码级，无网络；vendor 一致性由 vendor-sync 单独守卫）──
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tool-installer test suite
        run: python3 -m unittest discover -s tool-installer/tests -t tool-installer -v

  # ── vendor zipapp 与源码同步守卫（改源码忘重建 vendor 会让 CI 装旧二进制）──
  vendor-sync:
    name: Vendor zipapp in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check vendor/tool-installer matches source
        run: ./scripts/check-tool-installer-sync.sh

  # ── manifest 平台矩阵守卫（离线，秒级）──
  # 本作业存在的理由：其余作业只在**当前 runner 的**平台上跑（ubuntu + macos-latest
  # =arm64），所以 linux/aarch64 与 macos/x86_64 长期带着"规划期直接中止"和"下载成
  # 另一个架构的二进制"的缺陷却始终绿着。见 scripts/check-manifest-platforms.sh。
  manifest-matrix:
    name: Manifest platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check every platform resolves with pinned digests
        run: ./scripts/check-manifest-platforms.sh

  # ── Bootstrap ──
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - name: Run Layer 0 (tool-installer binary only)
        run: bash setup.sh --bootstrap
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: |
            ~/.local/bin/tool-installer --help
            ~/.local/bin/tool-installer install dev --dry-run

  # ── build-base: Rust 工具链 ──
  apply-build-base:
    name: "Apply: build-base (Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-base
        run: python3 vendor/tool-installer install build-base
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: |
            rustc --version
            cargo --version
            rustfmt --version
            clippy-driver --version

  # ── cargo-binstall: 预编译安装器 ──
  apply-cargo-binstall:
    name: "Apply: cargo-binstall"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cargo-binstall
        run: python3 vendor/tool-installer install cargo-binstall
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: cargo-binstall -V

  # ── cargo-tools: 29 个 Rust 工具 ──
  apply-cargo-tools:
    name: "Apply: cargo-tools (29 crates)"
    needs: [apply-cargo-binstall, apply-build-base]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean stale cargo install metadata
        run: rm -f ~/.cargo/.crates.toml ~/.cargo/.crates2.json
      - name: Install cargo-tools (needs cargo-binstall + build-base)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 vendor/tool-installer install cargo-binstall
          python3 vendor/tool-installer install build-base
          python3 vendor/tool-installer install cargo-tools
      # 硬断言 = tools.toml 里非 allow_fail 的工具；optional = allow_fail 的工具。
      # optional 仍会报告缺失（::warning），但不再像 `|| true` 那样把结果吞掉。
      - name: Verify key tools
        uses: ./.github/actions/verify-binaries
        with:
          commands: |
            mise --version
            uv --version
            cargo-audit --version
            cargo nextest --version
            bat --version
            eza --version
            fd --version
            zoxide --version
            tokei --version
            navi --version
            kondo --help
            jaq --version
            mdbook --version
            mdbook-mermaid --version
            gms --version
            conceal --version
            rust-script --version
            pdu --version
            nu --version
            macchina --version
          optional: |
            cargo-binstall -V
            sccache --version
            wild --version
            gitui --version
            tree-sitter --version
            tree-sitter-grep --version
            tree-sitter-show-ast --version
            cargo-fuzz --version
            grcov --version
            cargo-tarpaulin --version

  # ── languages: go, node, pnpm, zig, yazi, gopls ──
  apply-languages:
    name: "Apply: languages (mise)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prerequisites
        uses: ./.github/actions/install-prereqs
      - name: Install and verify languages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Trust and install
          mise trust
          python3 vendor/tool-installer install languages
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          path: '$HOME/.local/share/mise/shims:$HOME/.local/bin'
          commands: |
            mise list
            go version
            node --version
            pnpm --version
            zig version

  # ── shell-tools: starship ──
  apply-shell-tools:
    name: "Apply: shell-tools"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shell-tools
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.local/bin
          python3 vendor/tool-installer install shell-tools
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: starship -V

  # ── editors: neovim, helix, zellij, yq ──
  # 全部是 github-release，不需要额外 manager
  apply-editors:
    name: "Apply: editors"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editors
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.local/bin
          python3 vendor/tool-installer install editors
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: |
            nvim --version
            hx --version
            zellij --version
            yq --version

  # ── lsp-servers: npm/uv/github-release LSP ──
  # depends = languages → cargo-tools，所以这一步实际会解析全部 29 个 crate。
  # 没有 rust-cache 时其中 3 个走源码编译（实测 3m17s + 3m20s + 1m09s = 关键路径
  # 476s），和 apply-cargo-tools 跑同一批 crate 却只花 1m24s 的差别就在这里。
  apply-lsp-servers:
    name: "Apply: lsp-servers"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install prerequisites
        uses: ./.github/actions/install-prereqs
      - name: Install LSP servers via tool-installer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.local/bin
          python3 vendor/tool-installer install lsp-servers
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: |
            typescript-language-server --version
            bash-language-server --version
            marksman --version
            zls --version
          optional: |
            pyright --version
            yaml-language-server --version
            lua-language-server --version

  # ── extras: xdotter ──
  apply-extras:
    name: "Apply: extras"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extras
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.local/bin
          python3 vendor/tool-installer install extras
      - name: Verify
        uses: ./.github/actions/verify-binaries
        with:
          commands: xd --version
          optional: wezterm --version

  # ── 全量安装 + 幂等复装（等所有模块通过后）──
  # 幂等验证必须和首次安装同在一个作业里：先前它单列成 re-install 作业，跑在
  # 全新 runner 的空 $HOME 上，等于又装了第二遍——35 个工具重跑，只有 rust-cache
  # 恢复出来的 24 个 cargo crate 命中 skip，名叫 idempotency 却什么都没验证。
  full-install:
    name: "Apply: dev (full + idempotency) — ${{ matrix.os }}"
    needs: [dry-run, bootstrap, apply-cargo-binstall, apply-build-base, apply-cargo-tools, apply-shell-tools, apply-editors, apply-languages, apply-lsp-servers, apply-extras]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - name: Disable mirrors for CI
        run: ./scripts/ci-disable-mirrors.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean stale cargo install metadata
        run: rm -f ~/.cargo/.crates.toml ~/.cargo/.crates2.json
      - name: Install prerequisites
        uses: ./.github/actions/install-prereqs
      - name: Full install
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          # 无 check 能力的 script 工具按设计每次重跑，先记下名单供幂等步骤豁免。
          # || true：一个都没有时（grep 退出 1）不该弄死安装步骤——空名单只会让
          # 后面的幂等断言更严格。
          python3 vendor/tool-installer install dev --dry-run | grep 'manager=script' \
            | sed -n 's/.*tool=\([^ ]*\).*/\1/p' | sort -u > /tmp/script-tools.txt || true
          python3 vendor/tool-installer install dev
      - name: Comprehensive verification
        uses: ./.github/actions/verify-binaries
        with:
          path: '$HOME/.local/share/mise/shims:$HOME/.local/bin:$HOME/.cargo/bin'
          commands: |
            rustc --version
            cargo --version
            nvim --version
            hx --version
            zellij --version
            yq --version
            bat --version
            eza --version
            fd --version
            tokei --version
            zoxide --version
            nu --version
            uv --version
            mise --version
            starship -V
            go version
            node --version
            typescript-language-server --version
            bash-language-server --version
          optional: |
            gitui --version
            navi --version
            macchina --version
            marksman --version
            zls --version
            lua-language-server --version
            pyright --version
            wezterm --version
      # 第二次 install dev：带 check 能力的工具都该命中 Skip。
      # 两类豁免：manager=script 的条目没有 check（base.CommandManager.check 恒返回
      # NOT_SATISFIED），按设计每次重跑；以及 rust 这条 moving channel（见下）。
      - name: Re-install is idempotent
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          # comm 要求两个文件按同一 collation 排好序；macOS 的 BSD sort/comm 在
          # en_US 下与 sort -u 的结果不一致，会直接报 "not in sorted order"。
          export LC_ALL=C
          # rust 按设计每次重跑：RustupManager.check 对 stable/nightly 这类 moving
          # channel 额外要求 `rustup check` 报 up to date，runner 镜像里的 stable
          # 落后一天就会重装一次 toolchain——那是更新，不是"漏认已装"。
          # 名单只放行 rust，任何新出现的重跑仍会硬失败。
          printf 'rust\n' > /tmp/moving-channel.txt
          set +e
          python3 vendor/tool-installer install dev >/tmp/reinstall.log 2>&1
          status=$?
          set -e
          cat /tmp/reinstall.log
          if [ $status -ne 0 ]; then
            echo "::error::第二次 install dev 退出码 $status"
            exit 1
          fi
          sed -n 's/^📦 Installing //p' /tmp/reinstall.log | sort -u > /tmp/seen.txt
          sed -n 's/^✅ Skip //p'        /tmp/reinstall.log | sort -u > /tmp/skipped.txt
          comm -23 /tmp/seen.txt /tmp/skipped.txt > /tmp/reinstalled.txt
          comm -23 /tmp/reinstalled.txt /tmp/script-tools.txt \
            | comm -23 - /tmp/moving-channel.txt > /tmp/offenders.txt
          echo "重跑工具 $(wc -l < /tmp/reinstalled.txt) 个（无 check 的 script 工具与 moving channel 的 rust 已豁免）"
          if [ -s /tmp/offenders.txt ]; then
            echo "::error::check 未识别出以下已安装工具（会被无谓重装）：$(tr '\n' ' ' < /tmp/offenders.txt)"
            exit 1
          fi
          # cargo 侧的“已存在”冲突意味着二进制在盘上却 check 说没装——
          # 连字符 bin 名（#7）与预发布版本号（#8）都会以这个信号暴露。
          if grep -q 'already exists in destination' /tmp/reinstall.log; then
            echo "::error::检测到 cargo \"already exists in destination\"，check 漏认已装二进制"
            grep 'already exists in destination' /tmp/reinstall.log
            exit 1
          fi
          echo "✅ 幂等：除 $(wc -l < /tmp/reinstalled.txt) 个按设计重跑的工具外全部 Skip"
