name: E2E Full Install

# 端到端完整安装测试：在最小容器镜像内一键运行 setup.sh
# 覆盖 Layer 0 (bootstrap) + Layer 1 (deploy + install) + Layer 2 (post)
# 并验证所有关键工具是否正确安装
#
# 为什么用容器而不是 runner 裸机：
#   ubuntu-latest runner 镜像预装了 clang/libicu/unzip 等大量工具，
#   会掩盖 setup.sh 对环境的隐含假设（历史上多次"CI 绿、本机 WSL/最小系统挂"）。
#   ubuntu:24.04 / ubuntu:26.04 官方镜像只有 apt+base-files，能真实验证
#   install-system-packages.sh / llvmup / tool-installer 自己补齐依赖。
# macOS 仍跑在 runner 裸机（macOS 容器不可行）。

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        include:
          - name: ubuntu-24.04-minimal
            os: ubuntu-latest
            container: ubuntu:24.04
          - name: ubuntu-26.04-minimal
            os: ubuntu-latest
            container: ubuntu:26.04
          - name: macos-latest
            os: macos-latest
      fail-fast: false
    name: E2E full install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 120 || 90 }}
    permissions:
      contents: read
    env:
      # 启用 CI 严格模式，任何 Rust 工具安装失败都会终止构建
      CARGO_INSTALL_STRICT: 1
      # GitHub Token，避免 cargo-binstall 触发 API 限流
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # cargo 编译并行度
      # macOS: 4 核 14GB，4 并行（4 × 1.5GB = 6GB）
      # Ubuntu 容器: 2 核 7GB，2 并行（2 × 1.5GB = 3GB）
      CARGO_BUILD_JOBS: ${{ matrix.os == 'macos-latest' && 4 || 2 }}
      # CI 环境使用官方 PyPI（清华源对海外 runner 返回 403）
      UV_INDEX_URL: "https://pypi.org/simple"
      # CI runner 可直连 GitHub，禁用镜像站避免引入不稳定因素
      GITHUB_MIRRORS: ""
    steps:
      # 容器模式只预装 actions 自身的最小依赖（curl/git），
      # 其余全部交给 setup.sh——这正是被测内容；裸 apt 源即可工作
      - name: Install CI harness prerequisites (container only)
        if: matrix.container != ''
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable mirrors for CI
        run: |
          # GitHub release 下载直连，不走 ghfast 镜像
          perl -pi -e 's/^github_mirrors/#github_mirrors/' manifest.toml
          # crates.io 直连，不走 rsproxy（海外访问国内镜像偶发 504，曾挂 CI）
          perl -pi -e 's/^replace-with = "rsproxy-sparse"/#replace-with = "rsproxy-sparse"  # disabled for CI/' langs/rust/cargo/config.toml

      - name: Run full install (setup.sh)
        run: |
          chmod +x ./setup.sh
          ./setup.sh

      - name: Verify all installed tools
        run: |
          # 加载 dotfiles 环境变量（setup.sh 已部署符号链接）
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"

          if [ -f "./scripts/verify-docker-build.sh" ]; then
            chmod +x ./scripts/verify-docker-build.sh
            ./scripts/verify-docker-build.sh
          else
            echo "⚠️  验证脚本不存在，执行基本检查"
            for tool in zsh nvim hx yazi zellij starship mise navi fd rg; do
              if command -v $tool &>/dev/null; then
                echo "✅ $tool"
              else
                echo "❌ $tool 未安装"
                exit 1
              fi
            done
          fi

      - name: Verify mise [env] in interactive shell
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          # 模拟新登录交互式 shell，验证 [env] 变量是否被正确注入
          zsh -lic 'echo "STEP_API_KEY=${STEP_API_KEY:-(未设置)}"'
